<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tagd - You found something</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
         :root {
            --primary-color: #6b7be5;
            --accent-color: #5a6bc4;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
        }
        
        .lang-btn {
            background-color: #3a3a3a;
            color: #e0e0e0;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .lang-btn:hover {
            background-color: #4a4a4a;
        }
        
        .lang-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        
        .container {
            max-width: 500px;
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
        }
        
        .message {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
            color: #b0b0b0;
        }
        
        .info {
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
            text-align: left;
        }
        
        .info-item {
            margin-bottom: 16px;
        }
        
        .info-item:last-child {
            margin-bottom: 0;
        }
        
        .info-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 4px;
        }
        
        .info-value {
            font-size: 16px;
            color: #e0e0e0;
            word-break: break-all;
        }
        
        .info-value a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .info-value a:hover {
            text-decoration: underline;
        }
        
        .divider {
            height: 1px;
            background-color: #3a3a3a;
            margin: 24px 0;
        }
        
        .cta-button {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
            margin: 8px;
        }
        
        .cta-button:hover {
            background-color: var(--accent-color);
        }
        
        .cta-button.secondary {
            background-color: #3a3a3a;
            color: #e0e0e0;
        }
        
        .cta-button.secondary:hover {
            background-color: #4a4a4a;
        }
        
        .footer {
            font-size: 12px;
            color: #666;
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <div class="language-selector">
        <button class="lang-btn active" data-lang="en">English</button>
        <button class="lang-btn" data-lang="fr">Français</button>
    </div>

    <div class="container">
        <div class="icon">🏷️</div>
        <h1 id="pageTitle" data-i18n="title"></h1>

        <p class="message" data-i18n="subtitle">
            This item belongs to me. Please reach out - I'd love to have it back, or just chat about how you found it!
        </p>

        <div class="info">
            <div class="info-item">
                <div class="info-label" data-i18n="labels.owner">Owner</div>
                <div class="info-value" id="ownerName">Name not configured</div>
            </div>

            <div class="info-item">
                <div class="info-label" data-i18n="labels.email">Email</div>
                <div class="info-value">
                    <a id="ownerEmail" href="mailto:contact@example.com">contact@example.com</a>
                </div>
            </div>

            <div class="info-item">
                <div class="info-label" data-i18n="labels.website">Website</div>
                <div class="info-value">
                    <a id="ownerWebsite" href="https://example.com" target="_blank">example.com</a
            >
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap">
        <a id="emailBtn" href="mailto:contact@example.com" class="cta-button" data-i18n="buttons.sendEmail">
          Send Email
        </a>
                    <a id="websiteBtn" href="https://example.com" target="_blank" class="cta-button secondary" data-i18n="buttons.visitWebsite">
          Visit Website
        </a>
                </div>

                <div class="footer" data-i18n="footer">
                    Powered by <a href="https://github.com/stoneset/tagd" target="_blank" style="color: var(--primary-color); text-decoration: none;"><strong>tagd</strong></a> - Open source item recovery system
                </div>
            </div>

            <script>
                let translations = {};
                let currentLanguage = localStorage.getItem('language') || 'en';

                // Load translations
                async function loadTranslations(lang) {
                    try {
                        const response = await fetch(`/i18n/${lang}.json`);
                        translations = await response.json();
                    } catch (error) {
                        console.error(`Failed to load translations for ${lang}:`, error);
                    }
                }

                // Get nested value from object using dot notation
                function getNestedValue(obj, path) {
                    return path.split('.').reduce((current, prop) => current && current[prop], obj);
                }

                // Update all i18n elements on the page
                function updateTranslations() {
                    document.querySelectorAll('[data-i18n]').forEach((element) => {
                        const key = element.getAttribute('data-i18n');
                        const translation = getNestedValue(translations, key);

                        if (translation) {
                            if (element.classList.contains('footer')) {
                                element.innerHTML = translation;
                            } else {
                                element.textContent = translation;
                            }
                        }
                    });
                    updateEmailButton();
                    updateTitleWithItem();
                }

                // Switch language
                function setLanguage(lang) {
                    currentLanguage = lang;
                    localStorage.setItem('language', lang);

                    // Update active button
                    document.querySelectorAll('.lang-btn').forEach((btn) => {
                        btn.classList.toggle('active', btn.dataset.lang === lang);
                    });

                    loadTranslations(lang).then(updateTranslations);
                }

                // Build mailto URL with pre-filled content
                function buildMailtoUrl(email, subject, body) {
                    const encodedSubject = encodeURIComponent(subject);
                    const encodedBody = encodeURIComponent(body);
                    return `mailto:${email}?subject=${encodedSubject}&body=${encodedBody}`;
                }

                // Update email button with translations
                function updateEmailButton() {
                    const email = document.getElementById('ownerEmail').textContent || 'contact@example.com';
                    const emailTranslations = getNestedValue(translations, 'email') || {};
                    const subject = emailTranslations.subject || 'Found your item';
                    const body = emailTranslations.body || 'Hi, I found your item!';
                    document.getElementById('emailBtn').href = buildMailtoUrl(email, subject, body);
                }

                // Load owner configuration from API
                async function loadAndDisplayConfig() {
                    try {
                        const response = await fetch('/api/config');
                        const appConfig = await response.json();

                        const owner = appConfig.owner || {};
                        document.getElementById('ownerName').textContent = owner.name || 'John Doe';
                        const ownerEmail = owner.email || 'contact@example.com';
                        document.getElementById('ownerEmail').href = `mailto:${ownerEmail}`;
                        document.getElementById('ownerEmail').textContent = ownerEmail;

                        const website = owner.website || 'https://example.com';
                        document.getElementById('ownerWebsite').href = website;
                        document.getElementById('ownerWebsite').textContent = new URL(website).hostname;

                        document.getElementById('websiteBtn').href = website;
                        updateEmailButton();

                        // Apply custom colors if provided
                        if (appConfig.appearance && appConfig.appearance.primaryColor) {
                            document.documentElement.style.setProperty('--primary-color', appConfig.appearance.primaryColor);
                        }
                        if (appConfig.appearance && appConfig.appearance.accentColor) {
                            document.documentElement.style.setProperty('--accent-color', appConfig.appearance.accentColor);
                        }
                    } catch (error) {
                        console.error('Failed to load config:', error);
                    }
                }

                // Get item ID from URL and update title
                function updateTitleWithItem() {
                    const pathParts = window.location.pathname.split('/');
                    const itemId = pathParts[2];
                    const titleElement = document.getElementById('pageTitle');
                    if (titleElement) {
                        const baseTranslation = getNestedValue(translations, 'title') || 'You found something';
                        // If we have a valid itemId, replace "something" with it
                        if (itemId && itemId !== 'Something') {
                            titleElement.textContent = baseTranslation.replace(/something/i, itemId);
                        } else {
                            // No itemId, just use the default translation
                            titleElement.textContent = baseTranslation;
                        }
                    }
                }

                // Language button listeners
                document.querySelectorAll('.lang-btn').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        setLanguage(btn.dataset.lang);
                    });
                });

                // Initialize
                loadAndDisplayConfig();
                loadTranslations(currentLanguage).then(() => {
                    updateTranslations();
                    document.querySelector(`[data-lang="${currentLanguage}"]`).classList.add('active');
                });
            </script>
</body>

</html>
